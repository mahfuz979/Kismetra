    const u=new SpeechSynthesisUtterance(tx);u.lang=lg;if(v)u.voice=v;u.pitch=pitch;u.rate=rate;u.volume=1;u.onstart=()=>{ok=true};
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
  setTimeout(()=>{if(!ok)babble(0,2.4,300)},1300);
}
function voicePhase(){
  const vs=VS(),rm=VR()||[],P=[2,1.8,2,1.7,2],R=[1.05,1.05,1,1.05,1.05];
  vs.forEach((x,i)=>tms.push(setTimeout(()=>{show(i);babble(0,.55,420);tms.push(setTimeout(()=>say(x,rm[i],P[i],R[i],i%2==0),520))},i*3400)));
  tms.push(setTimeout(finale,vs.length*3400+300));
}
function pop(a){try{const o=ctx.createOscillator(),g=ctx.createGain(),T0=ctx.currentTime+a;o.type='square';o.frequency.value=80+Math.random()*200;g.gain.setValueAtTime(.35,T0);g.gain.exponentialRampToValueAtTime(.001,T0+.05);o.connect(g);g.connect(ctx.destination);o.start(T0);o.stop(T0+.06)}catch(e){}}
/* 🟩 শুরুর দৃশ্য: পুরো ডিসপ্লে ঝিরঝির + গ্রিন লাইন (৬.৩ সেকেন্ড), তারপর হঠাৎ জাম্প-স্কেয়ার */
function glitch(){
  const g=$('#gl');g.className='a1';g.style.display='block';document.body.classList.add('bad');
  try{unlock();const T0=ctx.currentTime;
    const mk=(type,f0,f1,dur,vol)=>{const o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,T0);o.frequency.exponentialRampToValueAtTime(f1,T0+dur);gn.gain.setValueAtTime(vol,T0);gn.gain.linearRampToValueAtTime(vol*2.4,T0+dur);o.connect(gn);gn.connect(ctx.destination);o.start(T0);o.stop(T0+dur+.1);return o};
    fx=[mk('sawtooth',118,520,5,.08),mk('sine',7200,9800,5,.045),mk('square',60,200,5,.035)];
    const n=Math.floor(ctx.sampleRate*2),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),gn=ctx.createGain();s.buffer=b;s.loop=true;f.type='highpass';f.frequency.value=2500;gn.gain.setValueAtTime(.1,T0);gn.gain.linearRampToValueAtTime(.32,T0+5);s.connect(f);f.connect(gn);gn.connect(ctx.destination);s.start(T0);fx.push(s);
    for(let k=0;k<11;k++)pop(.3+k*.43)}catch(e){}
  navigator.vibrate&&navigator.vibrate([80,40,60,30,120,40,40,40,200,60,60,30,300,50,500]);
  setTimeout(()=>g.className='a2',1200);
  setTimeout(()=>g.className='a3',3000);
  setTimeout(()=>{g.className='s2';document.body.classList.remove('bad');fx.forEach(x=>{try{x.stop()}catch(e){}});navigator.vibrate&&navigator.vibrate(0)},5000);
  setTimeout(launch,6300);
}
function launch(){$('#gl').style.display='none';$('#scare').style.display='block';track('reveal');party()}
/* 👽 শেষে: ফোন ঠিক আছে — এলিয়েন কার্ড */
function finale(){
  if(fin)return;fin=true;tms.forEach(clearTimeout);tms=[];clearInterval(vib);try{speechSynthesis.cancel()}catch(e){}
  const g=$('#gl');g.className='s3';g.style.display='block';
  $('#f1').textContent=t('fz')[0];$('#f2').textContent=t('fz')[1];$('#f3').textContent=t('fz')[2];
  navigator.vibrate&&navigator.vibrate(0);blip();babble(0,.6,420);setTimeout(()=>say(t('fv'),t('fvr'),2,1,true),650);
}
$('#f3').onclick=()=>{$('#gl').style.display='none'};
function calm(){clearInterval(vib);$('#rev').classList.add('calm');ad('#adD')}

/* ===== ফ্লো ===== */
function start(){
  if($('#ld').style.display==='block'||$('#rev').style.display==='block'||$('#scare').style.display==='block')return;
  $('#ld').style.display='block';ad('#adC');unlock();track('search',{gender:$('#iam').value,country:$('#cn').value||'Any',looking:$('#lk').value});
  const m=t('lm');let i=0;$('#lm').textContent=m[0];$('#pb').style.width='8%';
  const iv=setInterval(()=>{i++;if(i>=m.length){clearInterval(iv);reveal();return}$('#lm').textContent=m[i];$('#pb').style.width=Math.round((i+1)/m.length*100)+'%'},1100);
}
function reveal(){
  $('#ld').style.display='none';gen=$('#iam').value==='f'?'f':'m';
  const r=t('r')[Math.floor(Math.random()*t('r').length)];
  $('#t1').textContent=gen==='f'?t('gg'):t('g');
  $('#t2').textContent=from?t('gf').replace('{n}',from):t('g0');
  $('#rn').textContent=r[0];$('#rd').textContent=r[1];$('#cap').textContent='';
  const ro=[...RO()].sort(()=>Math.random()-.5).slice(0,6);
  $('#roast').innerHTML=ro.map(x=>`<div class="rr"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  $('#sf').textContent=['👹','👻','💀','🧟'][Math.floor(Math.random()*4)];glitch();
}
$('#st').onclick=()=>{stopAll();$('#st').textContent=t('stopped')};
$('#go').onclick=()=>{
  const n=$('#nm').value.trim();if(!n)return $('#nm').focus();
  const link=BASE+'#g='+encodeURIComponent(n),m=encodeURIComponent(t('share').replace('{l}',link));
  $('#out').innerHTML='<div class="lk"></div><a class="b o" target="_blank" rel="noopener" href="https://wa.me/?text='+m+'">'+t('wa')+'</a><button class="b" id="cp">'+t('cp')+'</button>';
  $('#out .lk').textContent=link;track('share');
  $('#cp').onclick=()=>navigator.clipboard.writeText(link).then(()=>$('#cp').textContent=t('cpd'));
};
</script>
